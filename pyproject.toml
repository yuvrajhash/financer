[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financer"
version = "0.1.0"
description = "Private FX research and paper-trading engine"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dateutil>=2.9",
  "typer>=0.12",
  "tenacity>=8.2",
  "openai>=1.0",
  "kiteconnect>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
financer = "financer.cli:app"

[tool.setuptools.packages.find]
include = ["financer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
